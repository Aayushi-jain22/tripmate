<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>

  <!-- User -->
  <rect x="370" y="15" width="160" height="45" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="450" y="42" text-anchor="middle" font-size="15" fill="#1e1b4b">User query</text>

  <line x1="450" y1="60" x2="450" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LangGraph boundary -->
  <rect x="120" y="100" width="660" height="330" rx="12" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="140" y="122" font-size="13" fill="#475569">LangGraph StateGraph  (agent/graph.py)   —   state: {messages}</text>

  <!-- agent node -->
  <rect x="330" y="150" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="450" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">agent node</text>
  <text x="450" y="198" text-anchor="middle" font-size="12" fill="#1e3a8a">llm.bind_tools(TOOLS).invoke(</text>
  <text x="450" y="214" text-anchor="middle" font-size="12" fill="#1e3a8a">system_prompt + messages)</text>

  <!-- provider box, off to the side -->
  <rect x="600" y="150" width="150" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="675" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">LLM provider</text>
  <text x="675" y="197" text-anchor="middle" font-size="11" fill="#4c1d95">Ollama (local) or</text>
  <text x="675" y="212" text-anchor="middle" font-size="11" fill="#4c1d95">Anthropic (API)</text>
  <text x="675" y="228" text-anchor="middle" font-size="10" fill="#6d28d9">agent/llm_factory.py</text>

  <line x1="570" y1="195" x2="600" y2="195" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="600" y1="205" x2="570" y2="205" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- conditional edge -->
  <polygon points="440,270 460,270 480,290 460,310 440,310 420,290" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="450" y="294" text-anchor="middle" font-size="10" fill="#713f12">tools_condition</text>
  <line x1="450" y1="240" x2="450" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tools node -->
  <rect x="330" y="330" width="240" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">tools node</text>
  <text x="450" y="376" text-anchor="middle" font-size="12" fill="#14532d">ToolNode(TOOLS) — runs 1+ calls</text>

  <line x1="450" y1="310" x2="450" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- tools -> agent loop -->
  <path d="M330,365 C260,365 260,195 330,195" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="285" font-size="11" fill="#333" transform="rotate(-90 215 285)">ToolMessages appended to state</text>

  <!-- END -->
  <rect x="620" y="270" width="90" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="665" y="295" text-anchor="middle" font-size="13" fill="#7f1d1d">END</text>
  <line x1="480" y1="290" x2="620" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Skills / tools box -->
  <rect x="150" y="445" width="600" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="170" y="467" font-size="13" fill="#7c2d12">Skills / tools  (tools/langchain_tools.py — thin @tool wrappers)</text>

  <rect x="180" y="485" width="260" height="90" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="310" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">search_destination_guide</text>
  <text x="310" y="528" text-anchor="middle" font-size="11" fill="#7c2d12">tools/rag_tool.py</text>
  <text x="310" y="544" text-anchor="middle" font-size="10" fill="#9a3412">TF-IDF over destination_data.json</text>
  <text x="310" y="558" text-anchor="middle" font-size="10" fill="#9a3412">visas · customs · packing · safety</text>

  <rect x="460" y="485" width="260" height="90" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="590" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">get_weather_forecast</text>
  <text x="590" y="528" text-anchor="middle" font-size="11" fill="#7c2d12">tools/weather_tool.py</text>
  <text x="590" y="544" text-anchor="middle" font-size="10" fill="#9a3412">Mock seasonal lookup table</text>
  <text x="590" y="558" text-anchor="middle" font-size="10" fill="#9a3412">conditions + temp range by month</text>

  <line x1="450" y1="400" x2="450" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="422" font-size="10" fill="#333">dispatches to</text>

  <!-- Final answer -->
  <line x1="665" y1="310" x2="665" y2="405" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="405" width="160" height="45" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="680" y="432" text-anchor="middle" font-size="13" fill="#1e1b4b">Final answer → User</text>
</svg>
